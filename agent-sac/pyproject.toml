[project]
name = "sac-robot"
version = "0.1.0"
description = "Une voiture qui apprend à prendre un virage avec Soft Actor-Critic, codé à la main pour comprendre."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=2.0",
    "torch>=2.5",
    "matplotlib>=3.9",
]

[project.scripts]
train = "sac_robot.train:main"
export = "sac_robot.export:main"
export-slides = "sac_robot.export_slides:main"
compare = "sac_robot.compare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sac_robot"]
